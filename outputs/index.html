function renderTemplates(){const items=state.templateType==='hot'?BOOT.hotTemplates:BOOT.cinemaTemplates;$('#view-templates').innerHTML=`<div class="page-head"><div><span class="eyebrow">Production templates</span><h1>熱門台詞與生成配置</h1><p>模板不是換皮，而是已驗證的台詞、情緒弧線、節奏與導演指令；只要換上自己的聲音就能出 take。</p></div></div><div class="filter-tabs"><button class="filter-tab ${state.templateType==='hot'?'active':''}" data-template-type="hot">熱門聲音模板</button><button class="filter-tab ${state.templateType==='cinema'?'active':''}" data-template-type="cinema">電影／電視劇</button></div><div class="template-grid">${items.map(item=>templateCard(item,state.templateType)).join('')}</div>`}

function renderCasting(){const options=state.performances.map(p=>`<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('');$('#view-casting').innerHTML=`<div class="page-head"><div><span class="eyebrow">Casting assistant</span><h1>先找對演員，再談表演。</h1><p>推薦結果會說明為什麼適合；性別硬鎖、描述語意、認證狀態與多錨點能力都會進入排序。</p></div></div><div class="split"><form class="panel" id="casting-form"><h2>角色簡報</h2><div class="form-grid"><div class="field"><label>角色名稱</label><input id="cast-role" value="失去摯友後仍保持冷靜的女刑警" required></div><div class="field"><label>性別硬條件</label><select id="cast-gender"><option>女性</option><option>男性</option><option>不指定</option></select></div><div class="field"><label>年齡感</label><input id="cast-age" value="30–40 歲，成熟但不蒼老"></div><div class="field"><label>作品類型</label><input id="cast-genre" value="犯罪懸疑電影"></div></div><div class="field"><label>聲線特質與反差</label><textarea id="cast-traits">冷靜、可靠、低語時仍清楚；表面專業，情緒裂縫只出現一次。</textarea></div><div class="field"><label>主要表演種子</label><select id="cast-performance">${options}</select></div><button class="button primary" type="submit">◎ 分析並推薦聲音</button></form><section class="panel"><div class="section-head"><div><h2>推薦名單</h2><p>先看解釋，再批次試鏡。</p></div></div><div class="casting-result" id="casting-result"><div class="empty">填好角色簡報後開始配對</div></div></section></div>`}
function renderContinuity(){const scenes=BOOT.dialogueScenes;const active=scenes.find(s=>s.id===state.continuitySceneId)||scenes[0];const seedOptions=`<option value="">選擇聲音</option>`+state.seeds.map(seed=>`<option value="${esc(seed.id)}">${esc(seed.name)} · ${esc(seed.gender)}</option>`).join('');$('#view-continuity').innerHTML=`<div class="page-head"><div><span class="eyebrow">Scene continuity</span><h1>場景連戲時間軸</h1><p>先鎖定角色聲音，再依「上一句聽到什麼」逐句表演；單句重生不會推翻整場。</p></div><div class="head-actions"><button class="button" id="save-continuity">保存製作專案</button><button class="button primary" id="generate-scene">生成完整場景</button></div></div><section class="panel"><div class="form-grid"><div class="field"><label>場景模板</label><select id="continuity-template">${scenes.map(s=>`<option value="${esc(s.id)}" ${s.id===active.id?'selected':''}>${esc(s.title)}</option>`).join('')}</select></div><div class="field"><label>場景名稱</label><input id="continuity-title" value="${esc(active.title)}"></div></div><div class="card" style="margin-bottom:12px"><span class="eyebrow">${esc(active.format)} · ${esc(active.genre)}</span><h3>${esc(active.hook)}</h3><p>${esc(active.circumstance)}<br>人物關係：${esc(active.relationship)}</p></div><div class="form-grid">${Object.entries(active.roles).map(([key,role])=>`<div class="field"><label>${esc(key)} · ${esc(role.name)}｜建議 ${esc(role.gender)}</label><select class="continuity-seed" data-role="${esc(key)}">${seedOptions}</select><small>目的：${esc(role.objective)}｜潛台詞：${esc(role.subtext)}</small></div>`).join('')}</div><div class="section-head"><div><h2>逐句時間軸</h2><p>每一拍都保留接話反應、情緒與精準留白。</p></div><label class="field" style="margin:0"><small>停頓倍率</small><select id="pause-scale"><option value="0.75">緊湊 0.75×</option><option value="1" selected>自然 1×</option><option value="1.25">留白 1.25×</option><option value="1.5">慢戲 1.5×</option></select></label></div><div class="timeline">${active.turns.map((turn,i)=>`<article class="beat"><span class="beat-index">${i+1}</span><div class="rol
